[project]
name = "dualguard"
version = "0.1.0"
description = "Hybrid two-stage network intrusion detector (Autoencoder + LightGBM) on CIC-IDS2017"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "torch>=2.2",
    "pyyaml>=6",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "jupyterlab>=4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
